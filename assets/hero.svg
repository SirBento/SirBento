<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Bernard Towindo — Software Engineer, Harare, Zimbabwe">
  <title>Bernard Towindo — Software Engineer</title>
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b1a"/>
      <stop offset="55%" stop-color="#111437"/>
      <stop offset="100%" stop-color="#22103d"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.18" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.8" cy="0.55" r="0.45">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Animated name gradient -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Floor fade -->
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="floorMask">
      <rect x="0" y="236" width="1200" height="104" fill="url(#floorFade)"/>
    </mask>

    <clipPath id="card">
      <rect width="1200" height="340" rx="24"/>
    </clipPath>

    <!-- Isometric cubes (size 36) -->
    <g id="cubeC">
      <polygon points="0,-36 31.2,-18 0,0 -31.2,-18" fill="#67e8f9"/>
      <polygon points="-31.2,-18 0,0 0,36 -31.2,18" fill="#0891b2"/>
      <polygon points="0,0 31.2,-18 31.2,18 0,36" fill="#155e75"/>
      <polyline points="-31.2,-18 0,0 31.2,-18" fill="none" stroke="#cffafe" stroke-opacity="0.6" stroke-width="1"/>
    </g>
    <g id="cubeV">
      <polygon points="0,-36 31.2,-18 0,0 -31.2,-18" fill="#c4b5fd"/>
      <polygon points="-31.2,-18 0,0 0,36 -31.2,18" fill="#7c3aed"/>
      <polygon points="0,0 31.2,-18 31.2,18 0,36" fill="#4c1d95"/>
      <polyline points="-31.2,-18 0,0 31.2,-18" fill="none" stroke="#ede9fe" stroke-opacity="0.6" stroke-width="1"/>
    </g>
    <g id="cubeP">
      <polygon points="0,-36 31.2,-18 0,0 -31.2,-18" fill="#fbcfe8"/>
      <polygon points="-31.2,-18 0,0 0,36 -31.2,18" fill="#db2777"/>
      <polygon points="0,0 31.2,-18 31.2,18 0,36" fill="#831843"/>
      <polyline points="-31.2,-18 0,0 31.2,-18" fill="none" stroke="#fdf2f8" stroke-opacity="0.6" stroke-width="1"/>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#glowL)"/>
    <rect width="1200" height="340" fill="url(#glowR)"/>

    <!-- Twinkling stars -->
    <g fill="#e0f2fe">
      <circle cx="640" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="96" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="40" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="120" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="30" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="30" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1180" cy="170" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- 3D perspective floor -->
    <g mask="url(#floorMask)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1">
      <line x1="600" y1="236" x2="-1200" y2="340"/>
      <line x1="600" y1="236" x2="-750" y2="340"/>
      <line x1="600" y1="236" x2="-300" y2="340"/>
      <line x1="600" y1="236" x2="150" y2="340"/>
      <line x1="600" y1="236" x2="600" y2="340"/>
      <line x1="600" y1="236" x2="1050" y2="340"/>
      <line x1="600" y1="236" x2="1500" y2="340"/>
      <line x1="600" y1="236" x2="1950" y2="340"/>
      <line x1="600" y1="236" x2="2400" y2="340"/>
      <line x1="0" x2="1200" y1="240" y2="240">
        <animate attributeName="y1" values="240;340" dur="4s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="240;340" dur="4s" begin="0s" repeatCount="indefinite"/>
      </line>
      <line x1="0" x2="1200" y1="240" y2="240">
        <animate attributeName="y1" values="240;340" dur="4s" begin="-1s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="240;340" dur="4s" begin="-1s" repeatCount="indefinite"/>
      </line>
      <line x1="0" x2="1200" y1="240" y2="240">
        <animate attributeName="y1" values="240;340" dur="4s" begin="-2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="240;340" dur="4s" begin="-2s" repeatCount="indefinite"/>
      </line>
      <line x1="0" x2="1200" y1="240" y2="240">
        <animate attributeName="y1" values="240;340" dur="4s" begin="-3s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="240;340" dur="4s" begin="-3s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Glow under the cube stack -->
    <ellipse cx="960" cy="272" rx="160" ry="26" fill="url(#shadow)">
      <animate attributeName="rx" values="160;140;160" dur="6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Isometric cube stack (floats gently) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="6s" repeatCount="indefinite"/>
      <!-- layer 0 -->
      <use xlink:href="#cubeC" href="#cubeC" transform="translate(960 150)"/>
      <use xlink:href="#cubeC" href="#cubeC" transform="translate(991.2 168)"/>
      <use xlink:href="#cubeC" href="#cubeC" transform="translate(928.8 168)"/>
      <!-- layer 1 starts on the back cube -->
      <use xlink:href="#cubeV" href="#cubeV" transform="translate(960 114)"/>
      <use xlink:href="#cubeC" href="#cubeC" transform="translate(960 186)"/>
      <use xlink:href="#cubeC" href="#cubeC" transform="translate(1022.4 186)"/>
      <use xlink:href="#cubeC" href="#cubeC" transform="translate(897.6 186)"/>
      <use xlink:href="#cubeV" href="#cubeV" transform="translate(991.2 132)"/>
      <use xlink:href="#cubeV" href="#cubeV" transform="translate(928.8 132)"/>
      <use xlink:href="#cubeP" href="#cubeP" transform="translate(960 78)"/>
      <use xlink:href="#cubeC" href="#cubeC" transform="translate(991.2 204)"/>
      <use xlink:href="#cubeC" href="#cubeC" transform="translate(928.8 204)"/>
      <use xlink:href="#cubeV" href="#cubeV" transform="translate(960 150)"/>
      <use xlink:href="#cubeC" href="#cubeC" transform="translate(960 222)"/>
    </g>

    <!-- Free-floating cubes -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="5s" repeatCount="indefinite"/>
      <use xlink:href="#cubeP" href="#cubeP" transform="translate(1110 80) scale(0.55)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="7s" repeatCount="indefinite"/>
      <use xlink:href="#cubeV" href="#cubeV" transform="translate(820 70) scale(0.42)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.5s" repeatCount="indefinite"/>
      <use xlink:href="#cubeC" href="#cubeC" transform="translate(1130 236) scale(0.5)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="6.5s" repeatCount="indefinite"/>
      <use xlink:href="#cubeP" href="#cubeP" transform="translate(790 236) scale(0.35)"/>
    </g>

    <!-- Text -->
    <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="70" y="86" fill="#22d3ee" font-size="14" font-weight="600" letter-spacing="4">HELLO WORLD, I'M</text>
      <text x="68" y="146" fill="url(#nameGrad)" font-size="62" font-weight="800" letter-spacing="-1">Bernard Towindo</text>
      <text x="70" y="186" fill="#e2e8f0" font-size="22" font-weight="500">Software Engineer · Full-Stack · Cloud · Mobile</text>
      <text x="70" y="214" fill="#94a3b8" font-size="16">Building scalable products from Harare, Zimbabwe</text>

      <!-- Tech pills -->
      <g font-size="13" font-weight="600" text-anchor="middle">
        <rect x="70" y="238" width="62" height="28" rx="14" fill="#0e7490" fill-opacity="0.35" stroke="#22d3ee" stroke-opacity="0.6"/>
        <text x="101" y="257" fill="#a5f3fc">Java</text>
        <rect x="142" y="238" width="106" height="28" rx="14" fill="#166534" fill-opacity="0.35" stroke="#4ade80" stroke-opacity="0.6"/>
        <text x="195" y="257" fill="#bbf7d0">Spring Boot</text>
        <rect x="258" y="238" width="72" height="28" rx="14" fill="#1e3a8a" fill-opacity="0.4" stroke="#60a5fa" stroke-opacity="0.6"/>
        <text x="294" y="257" fill="#bfdbfe">React</text>
        <rect x="340" y="238" width="72" height="28" rx="14" fill="#5b21b6" fill-opacity="0.35" stroke="#a78bfa" stroke-opacity="0.6"/>
        <text x="376" y="257" fill="#ddd6fe">Kotlin</text>
        <rect x="422" y="238" width="60" height="28" rx="14" fill="#9d174d" fill-opacity="0.35" stroke="#f472b6" stroke-opacity="0.6"/>
        <text x="452" y="257" fill="#fbcfe8">GCP</text>
      </g>

      <!-- Live status dot -->
      <circle cx="76" cy="296" r="5" fill="#4ade80">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="76" cy="296" r="5" fill="none" stroke="#4ade80">
        <animate attributeName="r" values="5;12" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="92" y="301" fill="#86efac" font-size="14" font-weight="500">Shipping WeFiscalise · Open to contracts &amp; collaboration</text>
    </g>

    <!-- Border -->
    <rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="none" stroke="#38bdf8" stroke-opacity="0.25"/>
  </g>
</svg>
